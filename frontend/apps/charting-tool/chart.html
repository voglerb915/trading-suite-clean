<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charting Tool</title>

    <!-- Chart-spezifische Layouts -->
    <link rel="stylesheet" href="./chart.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- ROOT: Tabs links, Content rechts -->
    <div class="charting-root">

        <!-- VERTIKALE TABS -->
        <div id="charting-tabs">
            <button class="charting-tab active" data-tab="1">RS</button>
            <button class="charting-tab" data-tab="2">RRG</button>
            <button class="charting-tab" data-tab="3">View</button>
            <button class="charting-tab" data-tab="4">4</button>
            <button class="charting-tab" data-tab="5">5</button>
        </div>

        <!-- CONTENT-BEREICH -->
        <div class="charting-content">

            <!-- TAB 1: RS -->
            <div class="chart-panel chart-panel-rs" data-panel="1">

                <!-- SECTOR FILTER LEISTE -->
                <div id="sector-filter-container-rs"
                    style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;">
                </div>

                <div class="chart-panel-rs-left">
                    Chart RS – Links (Master)
                </div>

                <div class="chart-panel-rs-right">
                    <div class="chart-panel-rs-sub">
                        Chart RS – Rechts oben
                    </div>
                    <div class="chart-panel-rs-sub">
                        Chart RS – Rechts unten
                    </div>
                </div>
            </div>

            <!-- TAB 2: RRG -->
            <div class="chart-panel chart-panel-rrg" data-panel="2">

                <div class="chart-panel-rrg-top">

                    <h2 class="rrg-title">Market Rotation (Sectors, Industries & Stocks)</h2>

                    <div class="rrg-filter-row">
                        <div class="rrg-filter-block">
                            <div class="rrg-filter-title">SECTORS</div>
                            <div id="sector-filter-container-rrg"></div>
                        </div>

                        <div class="rrg-filter-block">
                            <div class="rrg-filter-title">QUADRANTS</div>
                            <div id="quadrant-filter-container-rrg"></div>
                        </div>

                        <div class="rrg-filter-block">
                            <div class="rrg-filter-title">INDEX</div>
                            <div id="index-filter-container-rrg"></div>
                        </div>
                    </div>

                </div>

                <div class="chart-panel-rrg-charts">

                    <!-- SECTORS -->
                    <div class="chart-panel-rrg-chart">
                        <canvas id="rrgCanvasSectors"></canvas>
                    </div>

                    <!-- INDUSTRIES -->
                    <div class="chart-panel-rrg-chart">
                        <canvas id="rrgCanvasIndustries"></canvas>
                    </div>

                    <!-- STOCKS -->
                    <div class="chart-panel-rrg-chart">
                        <canvas id="rrgCanvasStocks"></canvas>
                    </div>

                </div>
            </div>

            <!-- TAB 3: VIEW -->
            <div class="chart-panel chart-panel-view" data-panel="3">
                <div class="dashboard-container" style="display: flex; width: 100%; height: 100%; gap: 16px; box-sizing: border-box;">

                    <!-- LINKE SEITE -->
                    <div class="pane left-pane" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                        <h2>Industry RS Score & Performance (3M)</h2>

                        <!-- Sektor-Filter & Globale Metrik-Toggles -->
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px;">
                            <div id="sector-filter-container-view" style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px;"></div>

                            <!-- Globale Metrik-Pillen -->
                            <div class="global-metric-toggles" style="display: flex; gap: 6px; flex-shrink: 0; align-items: center;">
                                <button id="btn-toggle-score" class="pill active" data-metric="score" style="background: #f59e0b; color: #000000; border: 1px solid #f59e0b; padding: 6px 14px; height: 26px; line-height: 1.0; font-size: 12px; font-weight: 500; border-radius: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">Score</button>
                                <button id="btn-toggle-perf" class="pill" data-metric="perf" style="background: #2a2a2a; color: #ffffff; border: 1px solid #444; padding: 6px 14px; height: 26px; line-height: 1.0; font-size: 12px; font-weight: 500; border-radius: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">Perf</button>
                            </div>
                        </div>

                        <div class="chart-wrapper" style="position: relative; flex-grow: 1; width: 100%;">
                            <canvas id="combinedIndustryChart"></canvas>
                        </div>
                    </div>

                    <!-- RECHTE SEITE -->
                    <div class="pane right-pane-container" style="flex: 1; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

                        <!-- Oben -->
                        <div class="sub-pane" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <h3 id="sector-history-title" style="margin: 0; font-size: 1.1rem;">Sektor Verlauf (3M)</h3>
                            </div>
                            <div class="sub-chart-wrapper" style="position: relative; flex-grow: 1; width: 100%;">
                                <canvas id="sectorHistoryChart"></canvas>
                            </div>
                        </div>

                        <!-- Unten -->
                        <div class="sub-pane" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                            <h3 id="industry-history-title" style="margin-bottom: 8px; font-size: 1.1rem;">Industrie Verlauf (3M) - Bitte wählen</h3>
                            <div class="sub-chart-wrapper" style="position: relative; flex-grow: 1; width: 100%;">
                                <canvas id="industryHistoryChart"></canvas>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- TAB 4 -->
            <div class="chart-panel chart-panel-4" data-panel="4">
                Platzhalter Tab 4
            </div>

            <!-- TAB 5 -->
            <div class="chart-panel chart-panel-5" data-panel="5">
                Platzhalter Tab 5
            </div>

        </div>

    </div>

    <!-- Chart-Rendering -->
    <script type="module" src="./oldStructure/renderChart.js"></script>

    <!-- RRG Modul-Orchestrator -->
    <script type="module" src="./js/rrgMain.js"></script>

    <!-- Tab-Logik -->
    <script type="module" src="./js/tabs.js"></script>

</body>
</html>
