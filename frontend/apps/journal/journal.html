<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal - Cockpit</title>
    <link rel="stylesheet" href="/apps/journal/css/journal.css">
    <style>
        /* 50/50 Layout spezifisch für das Journal */
        .journal-container {
            display: flex;
            gap: 20px;
            width: 100%;
            height: calc(100vh - 40px);
            padding: 20px;
            box-sizing: border-box;
            background: #121212;
            color: #fff;
        }
        .journal-pane {
            flex: 1;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .pane-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #3498db;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #333;
        }
        th {
            color: #3498db;
            background: #252525;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #252525;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="tool-view">
        <div id="journal-root" style="width: 100%; height: 100%;">
            <div id="journal-loader" style="padding: 20px; color: #555;">
                Lade Journal-Daten...
            </div>
        </div>
    </div>

    <script type="module" src="/apps/journal/journal.js"></script>
</body>
</html>
